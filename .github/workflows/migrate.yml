# Run Alembic migrations against the production database.
# Triggers: (1) manual run from Actions, (2) on push to main when migrations/models change.
# Requires repo secret: PROD_DATABASE_URL (production Postgres connection string).

name: Run migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/alembic/**'
      - 'backend/app/models/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run migrations
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: uv run --frozen --no-dev alembic upgrade head
